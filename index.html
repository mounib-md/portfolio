<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/jpeg" href="/mon-profil.jpeg" />
  <link rel="apple-touch-icon" href="/mon-profil.jpeg" />
  <!-- preload Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
  >

  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    >
  </noscript>
  
  <!-- SEO Utama -->
  <title>Mohamed Mounib MEDIOUNI | Cloud &amp; DevOps Engineer</title>
  <meta name="description" content="Portfolio of Mohamed Mounib MEDIOUNI, a Computer Engineering student specializing in cloud infrastructure, DevOps, Kubernetes, and automation." />
  <meta name="keywords" content="Mohamed Mounib MEDIOUNI, Cloud Engineer, DevOps Engineer, Kubernetes, AWS, Terraform" />
  <meta name="author" content="Mohamed Mounib MEDIOUNI" />

  <!-- Google Search Console -->


  <!-- Theme / PWA -->
  <meta name="theme-color" content="#030014" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Mohamed Mounib MEDIOUNI | Cloud &amp; DevOps Engineer" />
  <meta property="og:description" content="Portfolio of Mohamed Mounib MEDIOUNI, Cloud &amp; DevOps Engineer." />
  <meta property="og:image" content="/mon-profil.jpeg" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Mohamed Mounib MEDIOUNI | Cloud &amp; DevOps Engineer" />
  <meta name="twitter:description" content="Portfolio of Mohamed Mounib MEDIOUNI, Cloud &amp; DevOps Engineer." />
  <meta name="twitter:image" content="/mon-profil.jpeg" />

  <!-- Structured Data: Person -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Mohamed Mounib MEDIOUNI",
    "image": "/mon-profil.jpeg",
    "jobTitle": "Cloud & DevOps Engineer",
    "description": "Computer Engineering student specializing in cloud infrastructure, DevOps, Kubernetes, and automation.",
    "sameAs": [
      "https://www.linkedin.com/in/mohamed-mounib-mediouni-b360a7369/",
      "https://github.com/mounib-md"
    ]
  }
  </script>
</head>

  <!-- Root React -->
  <div id="root"></div>

</html>
